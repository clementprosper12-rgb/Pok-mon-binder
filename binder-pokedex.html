<style>
:root{--bg:#16202e;--sleeve:#223247;--edge:#3a4f6b;--ink:#eaf0f7;--mute:#8fa3bb;--gold:#f2c14e;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{padding:env(safe-area-inset-top,0) 10px env(safe-area-inset-bottom,0);max-width:520px;margin:0 auto}
header{display:flex;gap:8px;align-items:center;padding:12px 0 8px}
h1{font-size:18px;margin:0;flex:1;font-weight:700}
#count{font-size:14px;color:var(--gold);font-variant-numeric:tabular-nums}
.bar{display:flex;gap:6px;margin-bottom:8px}
input,select,button{font:inherit;color:var(--ink);background:var(--sleeve);border:1px solid var(--edge);border-radius:10px;padding:9px 10px}
input{flex:1;min-width:0}
button{cursor:pointer}
button:active{background:var(--edge)}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#0f1722;padding:8px;border-radius:14px;border:2px solid var(--edge)}
.slot{aspect-ratio:63/88;border-radius:8px;background:var(--sleeve);border:1px dashed var(--edge);position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0}
.slot.full{border:1px solid var(--edge)}
.slot img.card{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot img.spr{width:62%;image-rendering:pixelated;filter:grayscale(1) brightness(.5);opacity:.7}
.slot .lab{font-size:11px;color:var(--mute);text-align:center;line-height:1.2;padding:0 4px}
.slot .num{position:absolute;top:3px;left:5px;font-size:10px;color:var(--mute);z-index:2;text-shadow:0 0 3px #000}
.slot.full .num{color:#fff}
.nav{display:flex;align-items:center;gap:8px;margin:10px 0}
.nav button{flex:1}
#pg{flex:2;text-align:center;font-size:14px;color:var(--mute)}
#modal{position:fixed;inset:0;background:rgba(8,12,18,.92);display:none;flex-direction:column;padding:env(safe-area-inset-top,0) 10px env(safe-area-inset-bottom,0);z-index:5}
#modal.on{display:flex}
#mh{display:flex;gap:8px;align-items:center;padding:12px 0}
#mh b{flex:1}
#list{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-content:start;padding-bottom:20px}
.opt{background:none;border:0;padding:0;text-align:center;font-size:10px;color:var(--mute)}
.opt img{width:100%;border-radius:6px;display:block;margin-bottom:3px}
#prog{height:6px;background:#0f1722;border-radius:3px;margin-bottom:8px;overflow:hidden}
#progf{height:100%;background:var(--gold);width:0;transition:width .3s}
#tgt{display:none;width:100%;margin-bottom:8px;text-align:left;border-color:var(--gold)}
#tgt.on{display:block}
#roul{position:fixed;inset:0;background:rgba(8,12,18,.94);display:none;align-items:center;justify-content:center;z-index:6}
#roul.on{display:flex}
#rbox{text-align:center;padding:20px;width:100%;max-width:380px}
#rimg{width:160px;height:160px;image-rendering:pixelated}
#rnum{color:var(--gold);font-size:18px;margin-top:6px}
#rnm{font-size:28px;font-weight:700;margin:4px 0 18px;min-height:34px}
.rb{display:flex;gap:8px;margin-bottom:8px}
.rb button{flex:1}
#rclose{width:100%}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tabs button{flex:1}
.tabs .on{border-color:var(--gold);color:var(--gold)}
#viewP{display:none}
.reg{display:block;width:100%;text-align:left;margin-bottom:8px;padding:10px 12px}
.reg .rt{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;margin-bottom:6px}
.reg small{color:var(--mute);font-size:12px}
.reg .rbar{height:8px;background:#0f1722;border-radius:4px;overflow:hidden}
.reg .rbar i{display:block;height:100%;background:var(--gold)}
.reg.done .rbar i{background:#6fcf97}
#msg{grid-column:1/-1;text-align:center;color:var(--mute);padding:30px 0}
</style>
</head>
<body>
<header><h1>Binder Pokédex <small style="font-weight:400;font-size:11px;color:var(--mute)">version 10</small></h1><span id="count"></span></header>
<div id="prog"><div id="progf"></div></div>
<div class="tabs"><button id="tB" class="on">Binder</button><button id="tP">Progression</button></div>
<div id="viewB">
<div class="bar">
  <input id="q" placeholder="Nom ou numéro (ex. Pikachu, 25)" enterkeyhint="search">
  <select id="f"><option value="all">Tous</option><option value="empty">Vides</option><option value="full">Remplis</option></select>
  <button id="spin">Roulette</button>
</div>
<button id="tgt"></button>
<div id="grid"></div>
<div class="nav"><button id="prev">Précédent</button><span id="pg"></span><button id="next">Suivant</button></div>
</div>
<div id="viewP"></div>

<div id="roul"><div id="rbox"><img id="rimg" alt=""><div id="rnum"></div><div id="rnm"></div>
  <div class="rb"><button id="rjump">Voir la case</button><button id="rre">Relancer</button></div>
  <button id="rclose">Fermer</button></div></div>

<div id="modal">
  <div id="mh"><b id="mt"></b><button id="rm">Vider</button><button id="close">Fermer</button></div>
  <input id="cf" placeholder="Filtrer (extension, nom…)" style="margin-bottom:8px;flex:none">
  <div id="list"></div>
</div>

<script>
var N=1025,PER=9,KEY="binderPokedex",NKEY="binderPokedexNamesFr2";
var TKEY="binderPokedexTarget";
var REG=[["Kanto",1,151],["Johto",152,251],["Hoenn",252,386],["Sinnoh",387,493],["Unys",494,649],["Kalos",650,721],["Alola",722,809],["Galar",810,898],["Hisui",899,905],["Paldea",906,1025]];
var names=[],saved={},page=0,cur=0,cards=[],target=0,spinning=false;
function lsGet(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
saved=lsGet(KEY,{});target=lsGet(TKEY,0);names=lsGet(NKEY,[]);
function nm(i){return names[i-1]||("#"+i)}
function ids(){var f=document.getElementById("f").value,a=[];
  for(var i=1;i<=N;i++){var s=!!saved[i];if(f==="all"||(f==="full"&&s)||(f==="empty"&&!s))a.push(i)}
  return a}
function render(){
  var a=ids(),pages=Math.max(1,Math.ceil(a.length/PER));
  if(page>=pages)page=pages-1;if(page<0)page=0;
  var g=document.getElementById("grid");g.innerHTML="";
  a.slice(page*PER,page*PER+PER).forEach(function(i){
    var b=document.createElement("button");b.className="slot"+(saved[i]?" full":"");
    var h='<span class="num">#'+i+'</span>';
    if(saved[i])h+='<img class="card" loading="lazy" src="'+saved[i]+'" alt="'+nm(i)+'">';
    else h+='<img class="spr" loading="lazy" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/'+i+'.png" alt=""><span class="lab">'+nm(i)+'</span>';
    b.innerHTML=h;b.onclick=function(){openModal(i)};g.appendChild(b)});
  document.getElementById("pg").textContent="Page "+(page+1)+" / "+pages;
  var cnt=Object.keys(saved).length;
  document.getElementById("count").textContent=cnt+" / "+N;
  document.getElementById("progf").style.width=(cnt/N*100)+"%";
  if(target&&saved[target]){target=0;lsSet(TKEY,0)}
  var tb=document.getElementById("tgt");
  if(target){tb.className="on";tb.textContent="À trouver : #"+target+" "+nm(target)+" (touche pour voir la case)"}else tb.className="";
  renderP();
}
document.getElementById("prev").onclick=function(){page--;render();window.scrollTo(0,0)};
document.getElementById("next").onclick=function(){page++;render();window.scrollTo(0,0)};
document.getElementById("f").onchange=function(){page=0;render()};
document.getElementById("q").onchange=function(){
  var v=this.value.trim().toLowerCase();if(!v)return;
  var t=parseInt(v,10);
  if(!(t>=1&&t<=N)){t=0;for(var i=1;i<=N;i++){if(nm(i).toLowerCase().indexOf(v)===0){t=i;break}}
    if(!t)for(var j=1;j<=N;j++){if(nm(j).toLowerCase().indexOf(v)>=0){t=j;break}}}
  if(!t)return;
  document.getElementById("f").value="all";page=Math.floor((t-1)/PER);render();window.scrollTo(0,0);
};
function goTo(t){document.getElementById("f").value="all";page=Math.floor((t-1)/PER);render();window.scrollTo(0,0)}
function pool(){var a=[];for(var i=1;i<=N;i++)if(!saved[i])a.push(i);return a}
function showR(n){document.getElementById("rimg").src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/"+n+".png";
  document.getElementById("rnum").textContent="#"+n;document.getElementById("rnm").textContent=nm(n)}
function spin(){
  if(spinning)return;
  var p=pool(),r=document.getElementById("roul");r.className="on";
  if(!p.length){document.getElementById("rimg").style.visibility="hidden";document.getElementById("rnum").textContent="";document.getElementById("rnm").textContent="Binder complet !";return}
  document.getElementById("rimg").style.visibility="visible";
  var fin=p[Math.floor(Math.random()*p.length)],steps=28,k=0;
  spinning=true;document.getElementById("rre").disabled=true;document.getElementById("rjump").disabled=true;
  function tick(){
    if(k<steps){showR(p[Math.floor(Math.random()*p.length)]);k++;setTimeout(tick,40+k*k*0.45)}
    else{showR(fin);target=fin;lsSet(TKEY,target);spinning=false;
      document.getElementById("rre").disabled=false;document.getElementById("rjump").disabled=false;render()}
  }
  tick();
}
document.getElementById("spin").onclick=spin;
document.getElementById("rre").onclick=spin;
document.getElementById("rjump").onclick=function(){document.getElementById("roul").className="";if(target)goTo(target)};
document.getElementById("rclose").onclick=function(){if(!spinning)document.getElementById("roul").className=""};
document.getElementById("tgt").onclick=function(){if(target)goTo(target)};
function renderP(){
  var v=document.getElementById("viewP");v.innerHTML="";
  REG.forEach(function(r){
    var tot=r[2]-r[1]+1,c=0;
    for(var i=r[1];i<=r[2];i++)if(saved[i])c++;
    var b=document.createElement("button");b.className="reg"+(c===tot?" done":"");
    b.innerHTML='<div class="rt"><span>'+r[0]+' <small>#'+r[1]+' à #'+r[2]+'</small></span><span>'+c+' / '+tot+' · '+Math.round(c/tot*100)+'%</span></div><div class="rbar"><i style="width:'+(c/tot*100)+'%"></i></div>';
    b.onclick=function(){showTab("B");goTo(r[1])};
    v.appendChild(b)});
}
function showTab(t){
  document.getElementById("viewB").style.display=t==="B"?"":"none";
  document.getElementById("viewP").style.display=t==="P"?"block":"none";
  document.getElementById("tB").className=t==="B"?"on":"";
  document.getElementById("tP").className=t==="P"?"on":"";
  window.scrollTo(0,0)}
document.getElementById("tB").onclick=function(){showTab("B")};
document.getElementById("tP").onclick=function(){showTab("P")};
function openModal(i){
  cur=i;document.getElementById("mt").textContent="#"+i+" "+nm(i);
  document.getElementById("rm").style.display=saved[i]?"":"none";
  document.getElementById("cf").value="";
  document.getElementById("modal").className="on";
  var l=document.getElementById("list");l.innerHTML='<div id="msg">Chargement des cartes…</div>';
  cards=[];
  function ok(r){if(!r.ok)throw 0;return r.json()}
  function nk(id){var j=id.lastIndexOf("-");if(j<0)return id.toLowerCase();
    return id.slice(0,j).toLowerCase().replace(/(\d)pt(\d)/g,"$1.$2").replace(/([a-z])0+(\d)/g,"$1$2")+"-"+id.slice(j+1).toLowerCase().replace(/^0+(?=\d)/,"")}
  var API="https://api.tcgdex.net/v2/";
  function conv(d){return d.filter(function(c){return c.image&&!/^(A\d|B\d|P-A)/.test(c.id)}).map(function(c){return {id:c.id,k:nk(c.id),img:c.image+"/low.webp",info:c.id.split("-")[0]+" · n°"+c.localId,key:c.id+" "+c.name}})}
  function tc(lang){return fetch(API+lang+"/cards?dexId="+i).then(ok).then(function(d){if(!Array.isArray(d))throw 0;return conv(d)})}
  function esc(t){return t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}
  function nq(lang,n){if(!n||n.charAt(0)==="#")return Promise.resolve([]);
    var re=new RegExp("(^|[^A-Za-z\u00C0-\u00FF0-9])"+esc(n)+"($|[^A-Za-z\u00C0-\u00FF0-9])","i");
    return fetch(API+lang+"/cards?name="+encodeURIComponent(n)).then(ok).then(function(d){if(!Array.isArray(d))throw 0;return conv(d.filter(function(c){return re.test(c.name)}))})}
  var en=fetch("https://pokeapi.co/api/v2/pokemon-species/"+i).then(ok).then(function(d){var e=d.names.filter(function(x){return x.language.name==="en"})[0];return e?e.name:""}).catch(function(){return ""});
  function z(p){return p.catch(function(){return []})}
  var base=[],extra=[];
  function build(){var o=[],seen={};base.concat(extra).forEach(function(c){if(!seen[c.k]){seen[c.k]=1;o.push(c)}});return o}
  function push(){if(cur!==i)return;cards=build();document.getElementById("mt").textContent="#"+i+" "+nm(i)+" · "+cards.length+" cartes";showCards()}
  function pt(pg){return fetch("https://api.pokemontcg.io/v2/cards?q=nationalPokedexNumbers:"+i+"&pageSize=250&page="+pg+"&select=id,name,images,set,rarity,number").then(ok)}
  function ptAll(){return pt(1).then(function(d){var a=d.data||[];
    if(d.totalCount>250)return pt(2).then(function(e){return a.concat(e.data||[])}).catch(function(){return a});return a}).then(function(a){
    return a.filter(function(c){return c.images&&c.images.small}).map(function(c){var st=c.set?c.set.name:"";
      return {id:c.id,k:nk(c.id),img:c.images.small,info:st+" · "+c.number+(c.rarity?" · "+c.rarity:""),key:st+" "+c.number+" "+(c.rarity||"")+" "+c.name}})})}
  var p1=Promise.all([z(tc("fr")),z(tc("en")),en.then(function(n){return z(nq("en",n))}),z(nq("fr",nm(i)))]).then(function(x){
    var o=[],idx={};
    function add(l,over){l.forEach(function(c){if(c.k in idx){if(over)o[idx[c.k]]=c}else{idx[c.k]=o.length;o.push(c)}})}
    add(x[1],0);add(x[2],0);add(x[0],1);add(x[3],1);
    base=o;if(o.length)push()}).catch(function(){});
  var p2=ptAll().then(function(a){extra=a;if(a.length)push()}).catch(function(){});
  Promise.all([p1,p2]).then(function(){if(cur===i&&!base.length&&!extra.length)document.getElementById("list").innerHTML='<div id="msg">Aucune carte trouvée, ou chargement impossible. Réessaie dans un instant.</div>'});
}
function showCards(){
  var q=document.getElementById("cf").value.trim().toLowerCase(),l=document.getElementById("list");l.innerHTML="";
  var r=cards.filter(function(c){return !q||c.key.toLowerCase().indexOf(q)>=0});
  if(!r.length){l.innerHTML='<div id="msg">Aucune carte trouvée.</div>';return}
  r.forEach(function(c){
    var b=document.createElement("button");b.className="opt";
    b.innerHTML='<img loading="lazy" src="'+c.img+'" alt=""><span>'+c.info+'</span>';
    b.onclick=function(){saved[cur]=c.img;lsSet(KEY,saved);closeModal();render()};
    l.appendChild(b)});
}
function closeModal(){document.getElementById("modal").className=""}
document.getElementById("cf").oninput=showCards;
document.getElementById("close").onclick=closeModal;
document.getElementById("rm").onclick=function(){delete saved[cur];lsSet(KEY,saved);closeModal();render()};
render();
(function(){
  var q=[],fin=0,done=0;
  for(var i=1;i<=N;i++)if(!names[i-1])q.push(i);
  function next(){var i=q.shift();
    if(!i){if(++fin===6){lsSet(NKEY,names);render()}return}
    fetch("https://pokeapi.co/api/v2/pokemon-species/"+i).then(function(r){return r.json()}).then(function(d){
      var f=d.names.filter(function(x){return x.language.name==="fr"})[0];if(f)names[i-1]=f.name}).catch(function(){})
    .then(function(){done++;if(done%30===0){lsSet(NKEY,names);render()}next()})}
  for(var k=0;k<6;k++)next();
})();
</script>
</body>
</html>
